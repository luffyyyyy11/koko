<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    class="city-input"
                >
                <button id="searchBtn" class="search-btn">Search</button>
                <button id="locationBtn" class="location-btn" title="Use current location">📍</button>
            </div>
            <div id="errorMsg" class="error-message"></div>
        </div>

        <!-- Current Weather Section -->
        <div id="weatherContainer" class="weather-container hidden">
            <div class="current-weather">
                <div class="weather-header">
                    <h2 id="cityName">City Name</h2>
                    <p id="date" class="date"></p>
                </div>

                <div class="weather-main">
                    <div class="temp-section">
                        <img id="weatherIcon" src="" alt="weather icon" class="weather-icon">
                        <div class="temp-info">
                            <span id="temperature" class="temperature">--°C</span>
                            <span id="weatherDesc" class="description">--</span>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item">
                            <span class="label">Feels Like</span>
                            <span id="feelsLike" class="value">--°C</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Humidity</span>
                            <span id="humidity" class="value">--%</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Wind Speed</span>
                            <span id="windSpeed" class="value">-- m/s</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Pressure</span>
                            <span id="pressure" class="value">-- hPa</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Visibility</span>
                            <span id="visibility" class="value">-- km</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">UV Index</span>
                            <span id="uvIndex" class="value">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container">
                    <!-- Forecast cards will be inserted here -->
                </div>
            </div>

            <!-- Hourly Forecast -->
            <div class="hourly-section">
                <h3>Hourly Forecast</h3>
                <div id="hourlyContainer" class="hourly-container">
                    <!-- Hourly cards will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Data provided by OpenWeatherMap API</p>
            <p class="last-updated">Last updated: <span id="lastUpdated">--</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
